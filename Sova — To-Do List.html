<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sova — список дел</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="app">
    <header>
      <svg class="owl-mark" width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <path
          d="M22 4C12 4 6 12 6 22c0 8 4.5 14 8 16l2-5c1.8 1 3.9 1.5 6 1.5s4.2-.5 6-1.5l2 5c3.5-2 8-8 8-16C38 12 32 4 22 4Z"
          fill="#232842" stroke="#3a4066" />
        <circle cx="15.5" cy="20" r="5.2" fill="#eee6d3" />
        <circle cx="28.5" cy="20" r="5.2" fill="#eee6d3" />
        <circle cx="15.5" cy="20" r="2.4" fill="#12141c" />
        <circle cx="28.5" cy="20" r="2.4" fill="#12141c" />
        <path d="M22 22.5 24 27h-4l2-4.5Z" fill="#e3b34c" />
      </svg>
      <div>
        <h1>Sova</h1>
        <p class="tagline">Мудрая сова следит за твоими делами</p>
      </div>
    </header>

    <div class="composer">
      <input type="text" placeholder="Что нужно сделать?" id="new-task" />
      <button id="add-btn">Добавить</button>
    </div>

    <nav class="filters">
      <button class="active" data-filter="all">Все</button>
      <button data-filter="active">Активные</button>
      <button data-filter="done">Выполненные</button>
    </nav>

    <ul class="tasks" id="task-list">
      <li class="task">
        <span class="dot"></span>
        <span class="label">Пройти этап 1: основы JavaScript</span>
      </li>
      <li class="task">
        <span class="dot"></span>
        <span class="label">Разобраться с DOM и событиями</span>
      </li>
      <li class="task done">
        <span class="dot"></span>
        <span class="label">Создать каркас сайта Sova</span>
      </li>
    </ul>

    <footer>
      <span id="count">2 задачи осталось</span>
      <span>🦉 Sova · 2026</span>
    </footer>
  </div>
</body>

</html>
